[platformio]
; Plain `pio run` builds the firmware only. Tests: `pio test -e native`.
; The screens on this computer: `pio run -e sim`.
default_envs = m5stack-grey

[env:m5stack-grey]
; The tests run on the computer (env:native below), not on the device.
test_ignore = *
; Pinned: left unpinned, PlatformIO reuses whatever old version is already
; installed (it had picked 5.1.1 from 2022, with a four-year-old Bluetooth stack).
platform = espressif32@6.13.0
board = m5stack-grey
framework = arduino
lib_deps =
    m5stack/M5Unified
    ; Module Audio (M144): ES8388 codec with a headphone jack, stacked on a Core Basic.
    https://github.com/m5stack/M5Module-Audio.git
    ; Bluetooth audio out. 1.7.x needs no extra dependencies.
    https://github.com/pschatzmann/ESP32-A2DP.git#v1.7.4
; Bluetooth roughly doubles the firmware; use the 16 MB flash's larger app slot.
board_build.partitions = default_16MB.csv
; Pinned so auto-detect doesn't pick a Bluetooth serial port
upload_port = /dev/cu.usbserial-*
monitor_port = /dev/cu.usbserial-*
monitor_speed = 115200
; 921600 works on the Gray's USB chip but fails on the Core Basic v2.7's (CH9102)
upload_speed = 460800

; Tests that need no device, run on this computer: `pio test -e native`.
; They cover the code in lib/, which is plain C++ with no hardware in it:
; the sounds, the sequencer, the saved session, the WAV header (lib/drums)
; and what the button presses mean (lib/controls).
[env:native]
platform = native
framework =
lib_deps =
test_framework = unity
; test/support holds helpers the suites share.
build_flags = -std=gnu++17 -O2 -I test/support

; The screens on this computer, without the device: the real src/ui.cpp,
; sequencer and display library, with a made-up battery, Bluetooth and SD
; card behind them (sim/sim_main.cpp, which lists the keys). Needs SDL2
; (`brew install sdl2`).
;   pio run -e sim && .pio/build/sim/program     a window
;   pio run -e sim                               also updates the pictures in sim/shots
[env:sim]
platform = native
framework =
lib_deps = m5stack/M5GFX
test_ignore = *
build_src_filter = -<*> +<ui.cpp> +<../sim/sim_main.cpp>
; After each build: every picture again, and sim/shots/index.html with all of them.
extra_scripts = post:sim/after_build.py
build_flags =
    -std=c++17 -O1
    -Isim/shim
    ; Homebrew on an Apple-silicon Mac. (An Intel Mac has /usr/local.)
    -I/opt/homebrew/include -I/opt/homebrew/include/SDL2 -L/opt/homebrew/lib -lSDL2
    -DM5GFX_BOARD=board_M5Stack -DM5GFX_SCALE=2
